services: 

  ros2:
    container_name: ${COMPOSE_PROJECT_NAME}_ros2
    build: 
      context: .  # 현재 디렉토리
      dockerfile: Dockerfile  
    volumes:
      - ./${WORKSPACE_ROS}:${USERHOME}/${WORKSPACE_ROS}   # 현재 디렉토리 기본으로 연결 //원하는 경로로 바꿀 수 있음
      - ~/.ssh:${USERHOME}/.ssh  # 홈디렉토리에 있는 .ssh 연결
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # 디스플레이 연결 (GUI 프로그램 실행하기 위해)
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /sys:/sys:ro ## network관련
      - /var/run/dbus:/var/run/dbus:ro
      - /dev:/dev  #usb등의 장치 연결
    ports:
      - "${WEB_BRIDGE_SOCKET_PORT}:9090"
    command:
      ["ros2", "launch", "servo_motor_ros2", "full_system.launch.py"]
    restart: always  ## when need to restart after reboot (of course it starts always)
    ## network_mode: host
    hostname: localhost
    stdin_open: true
    privileged: true
    tty: true
    devices:
      - /dev:/dev
    group_add:
      - video
      - audio
    environment:
      - DISPLAY=$DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1 #nvidia
      - XAUTHORITY=/tmp/.docker.xauth
    networks:
      - ros2-web

  web:
    image: nginx:latest
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: always
    ports: 
      - "${WEB_PORT}:80"
    volumes: 
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  ## 서버배포시에는 prod ##로컬 개발시는 dev (env)
        - ./${WORKSPACE_WEB}:/var/www/html  # app 디렉토리도 생성한다해서 도커 nginx 서버와 매칭
    depends_on:
      - php
    links: # Explicitly link the service name # prevent from race condition
      - php
    networks:
      - ros2-web

  mysql:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MYSQL_PORT}:3306  ## 다른 프로젝트에서도 mysql 를 사용할 경우에 외부 포트 변경, (127...외부로 expose 안 되게 설정)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PWD}  # .env
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
      MYSQL_USER: ${MYSQL_USER_ID}
      MYSQL_PASSWORD: ${MYSQL_PWD}
      SERVICE_TAGS: dev 
      TZ: Asia/Seoul
    volumes:
      - ./mysqldata:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ros2-web

  php:
    # image: php:fpm #이렇게만 적으면 가장 최신버전을 받는다. Dockerfile 에서 받는다 
    container_name: ${COMPOSE_PROJECT_NAME}_php
    build:  # 위의 image는 제거
      context: .  # 현재 디렉토리
      dockerfile: php.Dockerfile
    working_dir: /var/www/html/home_monitor
    volumes:
      - ./${WORKSPACE_WEB}:/var/www/html  #이제 php를 app 디렉토리로 연결
    ports:
      - "${WEB_VITE_PORT}:5173"
    restart: always
    depends_on:
      - ros2
      - mysql
    # ports: 
      # - "9000:9000"
    networks:
      - ros2-web

networks:
  ros2-web:

volumes:
  mysqldata: {}